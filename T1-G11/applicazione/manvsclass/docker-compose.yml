name: t1

services:
  controller:
    image: mick0974/a13:t1-g11
    container_name: t1-controller
    restart: always
    expose:
      - 8081
    environment:
      MYSQL_HOST: mysql_db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: manvsclass
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      - mysql_db
    volumes:
      - ./FilesUpload:/Files-Upload
      - VolumeT0:/VolumeT0
    networks:
      - global-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mysql_db:
    image: mysql:8.0
    container_name: t1-mysql_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: manvsclass
    volumes:
      - mysql_data_volume:/var/lib/mysql
    networks:
      - global-network

networks:
  global-network:
    external: true

volumes:
  VolumeT0:
    external: true
  mysql_data_volume:
